# Install only after configuring TLS certificates and firewall.
# MIOSOCK listens on a TCP port without honoring the host config; block 9080 externally.
limit_req_zone $binary_remote_addr zone=mio_public:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=mio_lab:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=mio_conn:10m;
limit_conn_zone $server_name zone=mio_total:1m;
server {
    listen 80;
    server_name mumps.io;
    return 301 https://mumps.io$request_uri;
}
server {
    listen 443 ssl;
    server_name mumps.io;
    ssl_certificate /etc/letsencrypt/live/mumps.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mumps.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 512;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_conn mio_conn 5;
    limit_conn mio_total 40;
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host mumps.io;
    proxy_set_header Connection close;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    location = / { limit_except GET { deny all; } limit_req zone=mio_public burst=10 nodelay; proxy_pass http://127.0.0.1:9080; }
    location = /lab/run { limit_except POST { deny all; } limit_req zone=mio_lab burst=3 nodelay; proxy_pass http://127.0.0.1:9080; }
    location ~ ^/public/www/(site\.(css|js)|xterm\.(css|js))$ { limit_except GET { deny all; } limit_req zone=mio_public burst=15 nodelay; proxy_pass http://127.0.0.1:9080; }
    location / { return 404; }
}
